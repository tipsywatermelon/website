<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — TINYDISCO</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&family=Tenor+Sans&display=fallback" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'] } } } }</script>
  <link rel="stylesheet" href="css/button.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body class="bg-theme-base text-theme-primary font-sans antialiased">

  <site-nav></site-nav>

  <!-- PAGE HERO -->
  <section class="pt-36 pb-12 px-6">
    <div class="max-w-7xl mx-auto">
      <p class="text-theme-secondary text-xs tracking-[0.4em] uppercase mb-3">Our Work</p>
      <h1 class="text-4xl md:text-5xl font-bold">Gallery</h1>
    </div>
  </section>

  <!-- GALLERY GRID -->
  <section class="pb-24 px-6">
    <div class="max-w-7xl mx-auto">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="aspect-square bg-theme-card overflow-hidden cursor-pointer"><img src="images/IMG_0219.JPG" alt="Gallery image 1" class="gallery-img w-full h-full object-cover hover:scale-105 transition-transform duration-500"></div>
        <div class="aspect-square bg-theme-card overflow-hidden cursor-pointer"><img src="images/IMG_0257.JPG" alt="Gallery image 2" class="gallery-img w-full h-full object-cover hover:scale-105 transition-transform duration-500"></div>
        <div class="aspect-square bg-theme-card overflow-hidden cursor-pointer"><img src="images/IMG_0275.JPG" alt="Gallery image 3" class="gallery-img w-full h-full object-cover hover:scale-105 transition-transform duration-500"></div>
        <div class="aspect-square bg-theme-card overflow-hidden cursor-pointer"><img src="images/IMG_0337.JPG" alt="Gallery image 4" class="gallery-img w-full h-full object-cover hover:scale-105 transition-transform duration-500"></div>
        <div class="aspect-square bg-theme-card overflow-hidden cursor-pointer"><img src="images/IMG_0340.JPG" alt="Gallery image 5" class="gallery-img w-full h-full object-cover hover:scale-105 transition-transform duration-500"></div>
        <div class="aspect-square bg-theme-card overflow-hidden cursor-pointer"><img src="images/IMG_0260.JPG" alt="Gallery image 6" class="gallery-img w-full h-full object-cover hover:scale-105 transition-transform duration-500"></div>
        <div class="aspect-square bg-theme-card overflow-hidden cursor-pointer"><img src="images/IMG_0295.JPG" alt="Gallery image 7" class="gallery-img w-full h-full object-cover hover:scale-105 transition-transform duration-500"></div>
        <div class="aspect-square bg-theme-card overflow-hidden cursor-pointer"><img src="images/IMG_0331.JPG" alt="Gallery image 8" class="gallery-img w-full h-full object-cover hover:scale-105 transition-transform duration-500"></div>
      </div>
    </div>
  </section>

  <!-- LIGHTBOX (intentionally dark — overlays content) -->
  <div id="lightbox" style="display:none" class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center">
    <button id="lightbox-close" class="absolute top-6 right-6 text-white hover:text-white/60 transition-colors" aria-label="Close">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
    <button id="lightbox-prev" class="absolute left-4 md:left-8 text-white hover:text-white/60 transition-colors" aria-label="Previous">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"/>
      </svg>
    </button>
    <img id="lightbox-img" src="" alt="" class="max-w-[85vw] max-h-[85vh] object-contain">
    <button id="lightbox-next" class="absolute right-4 md:right-8 text-white hover:text-white/60 transition-colors" aria-label="Next">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"/>
      </svg>
    </button>
  </div>

  <site-footer></site-footer>

  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
